<script>
(function(){
  var K='lk.pass', SALT='VuoGWYA1Gv/HCYno5G6E9A==', IV='zEHa6dRlri+FW28/', N=600000;
  var T={jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',svg:'image/svg+xml',gif:'image/gif',webp:'image/webp'};
  function bytes(b){var s=atob(b),n=s.length,u=new Uint8Array(n);for(var i=0;i<n;i++)u[i]=s.charCodeAt(i);return u;}
  function blob(k,u){
    return fetch(u).then(function(r){if(!r.ok)throw 0;return r.arrayBuffer();}).then(function(b){
      return crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(b,0,12)},k,new Uint8Array(b,12));
    }).then(function(pt){var e=u.replace(/\.bin$/,'').split('.').pop().toLowerCase();
      return URL.createObjectURL(new Blob([pt],{type:T[e]||'application/octet-stream'}));},function(){return 'data:,';});
  }
  function open(pass){
    var ct=bytes(document.getElementById('lk-c').textContent.trim()), key;
    return crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey'])
      .then(function(m){return crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(SALT),iterations:N,hash:'SHA-256'},
        m,{name:'AES-GCM',length:256},false,['decrypt']);})
      .then(function(k){key=k;return crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(IV)},k,ct);})
      .then(function(pt){
        var html=new TextDecoder().decode(pt), us=[], m, re=/"lk:([^"]+)"/g;
        while((m=re.exec(html)))if(us.indexOf(m[1])<0)us.push(m[1]);
        try{sessionStorage.setItem(K,pass);}catch(e){}
        return Promise.all(us.map(function(u){return blob(key,u);})).then(function(bs){
          var map={};us.forEach(function(u,i){map[u]=bs[i];});
          html=html.replace(re,function(_,u){return '"'+map[u]+'"';});
          document.open();document.write(html);document.close();
          return true;
        });
      },function(){return false;});
  }
  var f=document.getElementById('f'), p=document.getElementById('p'), s=document.getElementById('s'), u=document.getElementById('u');
  function ask(){f.className='on';p.focus();}
  function busy(b){p.disabled=b;s.disabled=b;u.disabled=b;u.setAttribute('aria-busy',b?'true':'false');}
  s.addEventListener('click',function(){
    var on=p.type==='password';p.type=on?'text':'password';
    s.textContent=on?'hide':'show';s.setAttribute('aria-pressed',on?'true':'false');p.focus();
  });
  f.addEventListener('submit',function(e){
    e.preventDefault();var v=p.value;if(!v){p.focus();return;}busy(true);
    open(v).then(function(ok){if(!ok){p.value='';busy(false);p.focus();}});
  });
  var saved=null;try{saved=sessionStorage.getItem(K);}catch(e){}
  if(saved){open(saved).then(function(ok){if(!ok){try{sessionStorage.removeItem(K);}catch(e){}ask();}});}
  else ask();
})();
</script>
