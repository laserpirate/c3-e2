          return parsed().then(function(){document.open();document.write(html);document.close();return true;});
        });
      },function(){return false;});
  }
  function open(pass){
    return crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey'])
      .then(function(m){return crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(SALT),iterations:N,hash:'SHA-256'},
        m,{name:'AES-GCM',length:256},true,['decrypt']);})
      .then(function(k){return boot(k,function(){
        return crypto.subtle.exportKey('raw',k).then(function(raw){
          try{localStorage.setItem(K,JSON.stringify({s:SALT,k:b64(new Uint8Array(raw)),e:Date.now()+DAYS*864e5}));}catch(e){}
        },function(){});});},function(){return false;});
  }
  function fromToken(t){
    return crypto.subtle.importKey('raw',bytes(t.k),{name:'AES-GCM'},false,['decrypt']).then(function(k){return boot(k,null);},function(){return false;});
  }
  var f=document.getElementById('f'), p=document.getElementById('p'), s=document.getElementById('s'), u=document.getElementById('u');
  function ask(){f.className='on';p.focus();}
  function busy(b){p.disabled=b;s.disabled=b;u.disabled=b;u.setAttribute('aria-busy',b?'true':'false');}
  function drop(){try{localStorage.removeItem(K);}catch(e){}}
  s.addEventListener('click',function(){
    var on=p.type==='password';p.type=on?'text':'password';
    s.textContent=on?'hide':'show';s.setAttribute('aria-pressed',on?'true':'false');p.focus();
  });
  f.addEventListener('submit',function(e){
    e.preventDefault();var v=p.value;if(!v){p.focus();return;}busy(true);
    open(v).then(function(ok){if(!ok){p.value='';busy(false);p.focus();}});
  });
  try{sessionStorage.removeItem('lk.pass');localStorage.removeItem('lk.pass');}catch(e){}
  var t=null;try{t=JSON.parse(localStorage.getItem(K)||'null');}catch(e){t=null;}
  if(t&&t.s===SALT&&t.k&&t.e>Date.now()){fromToken(t).then(function(ok){if(!ok){drop();ask();}});}
  else{if(t)drop();ask();}
})();
