<script>
(function(){
  var K='lk.tok', SALT='oSw574DYuKiazgYZRQTmbg==', IV='zrRs/FryxzDthxNx', N=600000, DAYS=14;
  var T={jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',svg:'image/svg+xml',gif:'image/gif',webp:'image/webp'};
  function bytes(b){var s=atob(b),n=s.length,u=new Uint8Array(n);for(var i=0;i<n;i++)u[i]=s.charCodeAt(i);return u;}
  function b64(u8){var s='';for(var i=0;i<u8.length;i++)s+=String.fromCharCode(u8[i]);return btoa(s);}

      return crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(b,0,12)},k,new Uint8Array(b,12));
    }).then(function(pt){var e=u.replace(/\.bin$/,'').split('.').pop().toLowerCase();
      return URL.createObjectURL(new Blob([pt],{type:T[e]||'application/octet-stream'}));},function(){return 'data:,';});
  }
  function parsed(){return document.readyState==='loading'?new Promise(function(r){document.addEventListener('DOMContentLoaded',function(){r();});}):Promise.resolve();}
  function boot(key,remember){
    var ct=bytes(document.getElementById('lk-c').textContent.trim());
    return crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(IV)},key,ct).then(function(pt){
        var html=new TextDecoder().decode(pt), us=[], m, re=/"lk:([^"]+)"/g;
        while((m=re.exec(html)))if(us.indexOf(m[1])<0)us.push(m[1]);
        return (remember?remember():Promise.resolve()).then(function(){return Promise.all(us.map(function(u){return blob(key,u);}));}).then(function(bs){
          var map={};us.forEach(function(u,i){map[u]=bs[i];});
          window.__lkget=function(u){return blob(key,u);};

        });

  function open(pass){

  }

  }

  function ask(){f.className='on';p.focus();}

  function drop(){try{localStorage.removeItem(K);}catch(e){}}
