html,body{margin:0;height:100%;background:var(--bg)}
body{display:flex;align-items:center;justify-content:center;font:18px/1.5 ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}

    e.preventDefault();var v=p.value;if(!v){p.focus();return;}busy(true);

  var saved=null;try{saved=sessionStorage.getItem(K);}catch(e){}

})();
